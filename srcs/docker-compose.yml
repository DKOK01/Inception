services:
  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    restart: always
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    restart: always
    depends_on:
      - mariadb
    env_file: .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wp_data:/var/www/wordpress
    networks:
      - inception

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: always
    depends_on:
      - wordpress
    env_file: .env
    ports:
      - "443:443"
      - "9443:9443"
    volumes:
      - wp_data:/var/www/wordpress
    networks:
      - inception
  adminer:
    build:
      context: ./requirements/Bonuses/adminer
      dockerfile: Dockerfile
    container_name: adminer
    restart: always
    depends_on:
      - mariadb
    networks:
      - inception

  static_site:
    build:
      context: ./requirements/Bonuses/static_site
      dockerfile: Dockerfile
    container_name: static_site
    restart: always
    networks:
      - inception

  portainer:
    build:
      context: ./requirements/Bonuses/portainer
      dockerfile: Dockerfile
    container_name: portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - inception

  redis:
    build:
      context: ./requirements/Bonuses/redis
      dockerfile: Dockerfile
    container_name: redis
    restart: always
    networks:
      - inception

  ftp:
    build:
      context: ./requirements/Bonuses/ftp
      dockerfile: Dockerfile
    container_name: ftp
    restart: always
    env_file: .env
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    volumes:
      - wp_data:/var/www/wordpress
    secrets:
      - ftp_password
    networks:
      - inception

volumes:
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aysadeq/data/wordpress
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aysadeq/data/mariadb

networks:
  inception:
    driver: bridge
    name: inception

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
